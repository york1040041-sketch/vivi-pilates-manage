<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>老師課程查詢 - VIVI PILATES</title>
    <style>
        :root {
            --bg-color: #f5f6f8;
            --text-main: #333;
            --text-muted: #888;
            --brand-green: #11c258; 
            --brand-green-hover: #0e9c46;
        }

        body { font-family: 'Helvetica Neue', Arial, sans-serif; background-color: var(--bg-color); color: var(--text-main); margin: 0; padding: 0; display: flex; justify-content: center; }
        #app-container { width: 100%; max-width: 500px; background-color: #fff; min-height: 100vh; position: relative; box-shadow: 0 0 20px rgba(0,0,0,0.05); }
        
        .header { text-align: center; padding: 20px; font-weight: bold; border-bottom: 1px solid #eee; position: relative;}
        .content { padding: 20px; }

        .month-selector { display: flex; justify-content: center; align-items: center; gap: 15px; margin-bottom: 20px; font-weight: bold; font-size: 18px;}
        .month-btn { background: none; border: none; font-size: 18px; cursor: pointer; color: var(--text-muted); }

        .salary-card { background-color: var(--brand-green); color: white; padding: 20px; border-radius: 12px; margin-bottom: 25px; box-shadow: 0 6px 15px rgba(17, 194, 88, 0.3); }
        .salary-title { font-size: 13px; opacity: 0.9; margin-bottom: 5px; }
        .salary-amount { font-size: 32px; font-weight: bold; margin: 0; }

        .date-section { margin-bottom: 25px; }
        .date-title { font-size: 14px; color: var(--text-muted); margin-bottom: 10px; font-weight: bold; }
        
        .class-card { border: 1px solid #eee; border-radius: 12px; margin-bottom: 10px; overflow: hidden; }
        .class-header { padding: 15px; display: flex; justify-content: space-between; align-items: center; background: #fff; cursor: pointer; }
        .class-header:hover { background: #fafafa; }
        .class-info { display: flex; gap: 15px; align-items: center; }
        .class-icon { width: 40px; height: 40px; background: #f0ece9; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-weight: bold; color: #8c736d; }
        .class-time { font-size: 15px; font-weight: bold; margin-bottom: 4px; }
        .class-stats { font-size: 12px; color: var(--text-muted); }
        .class-salary { font-weight: bold; color: var(--text-main); font-size: 15px; transition: 0.3s; }

        .student-list { display: none; border-top: 1px dashed #eee; background: #fafafa; padding: 10px 15px; }
        .student-row { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid #eee; }
        .student-row:last-child { border-bottom: none; }
        .student-name { font-weight: bold; font-size: 15px; display: flex; align-items: center; gap: 5px;}
        .student-mode { font-size: 11px; padding: 2px 6px; border-radius: 4px; background: #e0e0e0; color: #555; }
        .student-mode.bimonthly { background: #ffe4cc; color: #d35400; }
        .student-mode.makeup { background: #e0f2f1; color: var(--brand-green); }
        
        .checkin-btn { background: white; border: 1px solid #ddd; color: var(--text-muted); padding: 6px 12px; border-radius: 6px; font-size: 13px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .checkin-btn.checked { background: var(--brand-green); border-color: var(--brand-green); color: white; }

        #loading { display: flex; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255,255,255,0.9); z-index: 1000; justify-content: center; align-items: center; flex-direction: column; font-weight: bold; color: var(--brand-green); }
    </style>
</head>
<body>

<div id="app-container">
    <div id="loading">讀取資料中...</div>
    
    <div class="header">老師課程管理系統</div>
    
    <div class="content">
        <div class="month-selector">
            <button class="month-btn" onclick="changeMonth(-1)">❮</button>
            <span id="display-month"></span>
            <button class="month-btn" onclick="changeMonth(1)">❯</button>
        </div>

        <div class="salary-card">
            <!-- 修改1：改成本月薪資 -->
            <div class="salary-title">本月薪資</div>
            <div class="salary-amount" id="total-salary">$ 0</div>
        </div>

        <div id="schedule-container">
            <!-- 課程區塊將由 JavaScript 自動生成 -->
        </div>
    </div>
</div>

<script>
    // ！！！！請確認這裡的 API_URL 與學生端使用的是同一個網址！！！！
    const API_URL = "https://script.google.com/macros/s/AKfycbwNW4YYWpuJezwaINSOB0agY4V6dbtNp4e01J5MNdZo6cWwthk1ieV8m2ja867C5v-hrQ/exec";
    
    // 【修改4】：設定後台管理系統的計薪規則，補課也算 750 元
    const SALARY_RATES = {
        '雙月預約': 750,
        '單堂預約': 900,
        '單堂補課': 750
    };

    let currentDate = new Date();
    let allRawBookings = [];
    let currentMonthSalary = 0; // 記錄全域的當月已簽到總薪資

    window.onload = () => {
        fetchAdminData();
    };

    function showLoading() { document.getElementById('loading').style.display = 'flex'; }
    function hideLoading() { document.getElementById('loading').style.display = 'none'; }

    function changeMonth(dir) {
        currentDate.setMonth(currentDate.getMonth() + dir);
        renderDashboard();
    }

    async function fetchAdminData() {
        showLoading();
        try {
            const response = await fetch(API_URL, {
                method: 'POST',
                body: JSON.stringify({ action: 'getAdminData' })
            });
            allRawBookings = await response.json();
            renderDashboard();
        } catch (error) {
            alert('資料讀取失敗，請確認網路連線');
        } finally {
            hideLoading();
        }
    }

    // 處理原始資料，分組轉換為畫面上需要的格式
    function renderDashboard() {
        const year = currentDate.getFullYear();
        const month = currentDate.getMonth() + 1;
        document.getElementById('display-month').innerText = `${year}年 ${month}月`;

        // 每次切換月份，總薪資都會歸零重新計算 (符合修改2)
        currentMonthSalary = 0; 
        
        const targetPrefix = `${year}-${String(month).padStart(2, '0')}`; // 例如: "2026-07"
        let groupedByDate = {};

        // 分類資料
        allRawBookings.forEach(booking => {
            booking.dates.forEach(dateKey => {
                if (dateKey.startsWith(targetPrefix)) {
                    const parts = dateKey.split('_');
                    const dateOnly = parts[0];
                    const timeOnly = parts[1];

                    if (!groupedByDate[dateOnly]) groupedByDate[dateOnly] = {};
                    if (!groupedByDate[dateOnly][timeOnly]) groupedByDate[dateOnly][timeOnly] = [];

                    const isCheckedIn = booking.checkins.includes(dateKey);
                    
                    groupedByDate[dateOnly][timeOnly].push({
                        uid: booking.uid,
                        name: booking.name,
                        mode: booking.mode,
                        dateKey: dateKey,
                        checkedIn: isCheckedIn
                    });
                }
            });
        });

        // 繪製畫面
        const container = document.getElementById('schedule-container');
        container.innerHTML = '';

        const sortedDates = Object.keys(groupedByDate).sort();

        if (sortedDates.length === 0) {
            container.innerHTML = '<div style="text-align:center; color:#999; margin-top:40px;">本月尚無課程資料</div>';
            document.getElementById('total-salary').innerText = '$ 0';
            return;
        }

        sortedDates.forEach(date => {
            const dObj = new Date(date);
            const weekdayStr = ['日','一','二','三','四','五','六'][dObj.getDay()];
            
            const dateSection = document.createElement('div');
            dateSection.className = 'date-section';
            dateSection.innerHTML = `<div class="date-title">${date.replace(/-/g, '/')} 週${weekdayStr}</div>`;

            const sortedTimes = Object.keys(groupedByDate[date]).sort();
            
            sortedTimes.forEach(time => {
                const students = groupedByDate[date][time];
                const checkedInCount = students.filter(s => s.checkedIn).length;
                
                // 【修改3】：預設計算「已經簽到」的學生薪資加總
                let classEarnedSalary = 0;
                let studentsHtml = '';
                
                students.forEach(s => {
                    let rate = SALARY_RATES[s.mode] || 0;
                    if (s.checkedIn) {
                        classEarnedSalary += rate;
                        currentMonthSalary += rate; // 累加到當月總薪資
                    }

                    // 判斷模式對應的標籤顏色與文字
                    let modeLabel = s.mode === '單堂補課' ? '補課' : (s.mode === '雙月預約' ? '雙月' : '單堂');
                    let modeClass = s.mode === '雙月預約' ? 'bimonthly' : (s.mode === '單堂補課' ? 'makeup' : '');
                    
                    let btnClass = s.checkedIn ? 'checkin-btn checked' : 'checkin-btn';
                    let btnText = s.checkedIn ? '已簽到' : '簽到';

                    // 綁定 onClick 傳遞 rate (該學生的單堂價值)
                    studentsHtml += `
                        <div class="student-row">
                            <div class="student-name">
                                ${s.name} <span class="student-mode ${modeClass}">${modeLabel}</span>
                            </div>
                            <button class="${btnClass}" onclick="toggleCheckin('${s.uid}', '${s.dateKey}', this, ${rate})">${btnText}</button>
                        </div>
                    `;
                });

                // 計算下課時間 (假設 55 分鐘)
                const [hr, min] = time.split(':').map(Number);
                const endDate = new Date(0,0,0, hr, min + 55);
                const endTime = String(endDate.getHours()).padStart(2,'0') + ":" + String(endDate.getMinutes()).padStart(2,'0');

                const classCard = document.createElement('div');
                classCard.className = 'class-card';
                classCard.innerHTML = `
                    <div class="class-header" onclick="toggleStudentList(this)">
                        <div class="class-info">
                            <div class="class-icon">V</div>
                            <div>
                                <div class="class-time">器械皮拉提斯 <span style="font-weight:normal; font-size:13px; color:#888;">${time}~${endTime}</span></div>
                                <div class="class-stats">預約: ${students.length} 人 ｜ 已簽到: <span class="checkin-counter">${checkedInCount}</span> 人</div>
                            </div>
                        </div>
                        <div class="class-salary" data-salary="${classEarnedSalary}">+ ${classEarnedSalary.toLocaleString()}</div>
                    </div>
                    <div class="student-list">
                        ${studentsHtml}
                    </div>
                `;
                dateSection.appendChild(classCard);
            });
            container.appendChild(dateSection);
        });

        // 載入完畢，渲染當月總薪資 (只包含有簽到的部分)
        document.getElementById('total-salary').innerText = `$ ${currentMonthSalary.toLocaleString()}`;
    }

    // 展開/收合學生名單
    function toggleStudentList(el) {
        // 確認點擊的不是簽到按鈕本身
        if(event.target.tagName.toLowerCase() === 'button') return;
        const list = el.nextElementSibling;
        list.style.display = list.style.display === 'block' ? 'none' : 'block';
    }

    // 發送簽到狀態給後端，並即時更新薪資數字
    async function toggleCheckin(uid, dateKey, btnElement, rate) {
        // 阻止點擊事件冒泡，避免觸發展開/收合
        event.stopPropagation();

        const isCurrentlyChecked = btnElement.classList.contains('checked');
        
        // 1. 即時變更按鈕樣式與數字邏輯
        if (isCurrentlyChecked) {
            btnElement.classList.remove('checked');
            btnElement.innerText = '簽到';
            currentMonthSalary -= rate; // 取消簽到，扣錢
        } else {
            btnElement.classList.add('checked');
            btnElement.innerText = '已簽到';
            currentMonthSalary += rate; // 簽到，加錢
        }

        // 2. 更新外層的人數計數器
        const counterSpan = btnElement.closest('.class-card').querySelector('.checkin-counter');
        let count = parseInt(counterSpan.innerText);
        counterSpan.innerText = isCurrentlyChecked ? (count - 1) : (count + 1);

        // 3. 更新單堂課的薪資小計
        const classSalaryEl = btnElement.closest('.class-card').querySelector('.class-salary');
        let currentClassSalary = parseInt(classSalaryEl.dataset.salary || 0);
        currentClassSalary = isCurrentlyChecked ? (currentClassSalary - rate) : (currentClassSalary + rate);
        classSalaryEl.dataset.salary = currentClassSalary;
        classSalaryEl.innerText = `+ ${currentClassSalary.toLocaleString()}`;

        // 4. 更新上方大綠色框的總薪資
        document.getElementById('total-salary').innerText = `$ ${currentMonthSalary.toLocaleString()}`;

        // 5. 非同步通知雲端資料庫
        try {
            await fetch(API_URL, {
                method: 'POST',
                body: JSON.stringify({ action: 'toggleCheckin', uid: uid, dateKey: dateKey })
            });
        } catch (error) {
            alert("網路錯誤，簽到狀態可能未儲存成功至雲端！");
        }
    }
</script>
</body>
</html>
